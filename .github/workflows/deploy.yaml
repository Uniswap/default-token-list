name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: # manual trigger
  
jobs:
  deploy:
    name: Deploy
    runs-on:
      group: npm-deploy
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.23.4"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Tests pass
        run: yarn test

      - name: Build list
        run: yarn build

      - name: Publish to NPM
        run: |
          npm install -g npm@11.6.3
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "Version ${PACKAGE_VERSION} already published, skipping..."
          else
            npm publish
          fi

      # tokens.uniswap.org serves this object from Uniswap/backend's tokenlists
      # stack (CloudFront in front of a private S3 bucket). The role can write
      # this one key and nothing else, and trusts only this workflow on main in
      # the `release` environment. No stored AWS secret.
      - name: AWS login
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: arn:aws:iam::654200013602:role/tokenlist-publisher-tokens-uniswap-org-prod
          role-session-name: default-token-list-release
          aws-region: us-east-2

      - name: Publish to tokens.uniswap.org
        run: |
          aws s3 cp build/uniswap-default.tokenlist.json \
            s3://uniswap-tokenlists-prod/tokens.uniswap.org/tokenlist.json \
            --content-type application/json \
            --cache-control "public, max-age=300"
